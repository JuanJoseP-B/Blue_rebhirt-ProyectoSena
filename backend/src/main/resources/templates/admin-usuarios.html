<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="|Usuarios · ${nombreApp}|">Usuarios · Blue Rebhirt</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/componentes.css"><link rel="stylesheet" href="/css/pantallas.css"></head><body><div class="pagina"><nav th:replace="~{fragments/menu :: menu('usuarios', false)}"></nav><main class="contenedor"><section class="modulo modulo--apoyo"><h1 class="titulo-lg">Usuarios</h1><p class="campo__error" th:if="${error}" th:text="${error}"></p><p class="apoyo" th:if="${param.guardado}">Contraseña actualizada.</p><ul class="lista"><li th:each="usuario : ${usuarios}"><div><strong th:text="${usuario.nombre}"></strong><p class="apoyo" th:text="|${usuario.correo} · ${usuario.rol}|"></p><form th:if="${usuario.rol == 'agricultor'}" method="post" th:action="@{/admin/usuarios/{id}/clave(id=${usuario.id})}"><label class="campo__etiqueta">Contraseña temporal <input class="campo__input" name="clave" type="password" minlength="6" maxlength="72" required></label><button class="btn btn--secundario" type="submit">Guardar</button></form></div></li></ul></section></main></div></body></html>
