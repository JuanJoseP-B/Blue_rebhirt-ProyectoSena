<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|Panel del administrador · ${nombreApp}|">Panel del administrador · Blue Rebhirt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/pantallas.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="pagina">
  <nav class="menu" aria-label="Administración">
    <a class="menu__marca" href="/admin"><img class="menu__logo" src="/img/logo-emblema.png" alt=""><span th:text="${nombreApp}">Blue Rebhirt</span></a>
    <ul class="menu__lista">
      <li><a class="menu__enlace" href="/admin" aria-current="page">Panel</a></li>
      <li><a class="menu__enlace" href="/admin/usuarios">Usuarios</a></li>
      <li><a class="menu__enlace" href="/admin/cultivos">Cultivos</a></li>
      <li><a class="menu__enlace" href="/admin">Rangos</a></li>
    </ul>
    <div class="menu__acciones">
      <form method="post" th:action="@{/salir}"><button class="btn btn--discreto" type="submit">Salir</button></form>
    </div>
  </nav>

  <main class="contenedor">
    <div class="panel panel--ancho">
      <section class="modulo modulo--formulario panel__protagonista" aria-labelledby="a-titulo">
        <div class="modulo__cabecera">
          <p class="modulo__etiqueta">Lo que usa el cálculo</p>
          <h1 class="titulo-lg" id="a-titulo">Rangos y <em class="enfasis">recomendaciones</em></h1>
        </div>
        <form class="modulo__formulario" method="post" th:action="@{/admin/rangos}">
          <div class="fila-rango fila-rango--cabeza etiqueta">
            <span>ESTADO</span><span>DESDE</span><span>HASTA</span><span>RECOMENDACIÓN</span>
          </div>

          <div class="fila-rango" th:each="rango : ${rangos}"><span class="estado" th:classappend="|estado--${rango.estado}|"><i aria-hidden="true" th:text="${rango.estado == 'ok' ? '✓' : (rango.estado == 'aviso' ? '!' : '▲')}"></i><span th:text="${rango.estado == 'ok' ? 'En rango' : (rango.estado == 'aviso' ? 'Revisar' : 'Fuera de rango')}"></span></span><input class="campo__input" type="number" name="desde" step="0.1" min="0" max="14" required th:value="${rango.ph_desde}" th:attr="aria-label=|${rango.zona}: desde|"><input class="campo__input" type="number" name="hasta" step="0.1" min="0" max="14" required th:value="${rango.ph_hasta}" th:attr="aria-label=|${rango.zona}: hasta|"><input class="campo__input" type="text" name="recomendacion" maxlength="255" required th:value="${rango.recomendacion}" th:attr="aria-label=|${rango.zona}: recomendación|"></div><p class="campo__error" th:if="${error}" th:text="${error}"></p><p class="apoyo" th:if="${param.guardado}">Rangos guardados.</p><div><button class="btn btn--primario" type="submit">Guardar rangos</button></div>
        </form>
      </section>

      <section class="modulo modulo--apoyo" aria-labelledby="a-usuarios">
        <p class="modulo__etiqueta">Cuentas</p>
        <h2 class="titulo-md" id="a-usuarios"><em class="enfasis">Usuarios</em></h2>
        <p class="cuerpo-fuerte"><span th:text="|${usuarios} usuarios|">Usuarios</span></p>
      </section>

      <section class="modulo modulo--apoyo" aria-labelledby="a-cultivos">
        <p class="modulo__etiqueta">Registrados</p>
        <h2 class="titulo-md" id="a-cultivos"><em class="enfasis">Cultivos</em></h2>
        <p class="cuerpo-fuerte"><span th:text="|${cultivos} cultivos|">Cultivos</span></p>
      </section>

      <nav class="panel__enlaces" aria-label="Más opciones">
        <a class="modulo modulo--enlace" href="/admin/mediciones">Mediciones recientes</a>
        <a class="modulo modulo--enlace" href="/admin/usuarios">Restablecer una contraseña</a>
      </nav>
    </div>
  </main>
</div>
</body>
</html>
