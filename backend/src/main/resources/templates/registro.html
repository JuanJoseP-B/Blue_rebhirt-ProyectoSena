<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|Crear cuenta · ${nombreApp}|">Crear cuenta · Blue Rebhirt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/pantallas.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="pagina">
  <nav class="menu" aria-label="Principal">
    <a class="menu__marca" href="/"><img class="menu__logo" src="/img/logo-emblema.png" alt=""><span th:text="${nombreApp}">Blue Rebhirt</span></a>
    <ul class="menu__lista">
      <li><a class="menu__enlace" href="/">Inicio</a></li>
      <li><a class="menu__enlace" href="/guia">Guía de abonos</a></li>
    </ul>
    <div class="menu__acciones">
      <a class="btn btn--discreto" href="/entrar">Entrar</a>
    </div>
  </nav>

  <main class="centrado">
    <form class="acceso" aria-labelledby="r-titulo" method="post" th:action="@{/registro}" th:object="${registroForm}">
      <h1 class="titulo-lg" id="r-titulo">Crear <em class="enfasis">cuenta</em></h1>
      <div class="acceso__form">
        <div class="campo">
          <label class="campo__etiqueta" for="r-nombre">Nombre</label>
          <input class="campo__input" id="r-nombre" type="text" th:field="*{nombre}" required maxlength="80" autocomplete="name">
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="r-correo">Correo</label>
          <input class="campo__input" id="r-correo" type="email" th:field="*{correo}" required maxlength="120" autocomplete="email">
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="r-clave">Contraseña</label>
          <input class="campo__input" id="r-clave" type="password" th:field="*{clave}" required minlength="6" maxlength="72" autocomplete="new-password">
          <p class="campo__ayuda">Mínimo 6 caracteres.</p>
        </div>
      </div>
      <p class="campo__error" th:if="${#fields.hasErrors('*')}" th:each="error : ${#fields.errors('*')}" th:text="${error}"></p><button class="btn btn--primario btn--completo" type="submit">Crear cuenta</button>
      <div class="acceso__alterno"><a class="btn btn--discreto" href="/entrar">Ya tengo cuenta</a></div>
    </form>
  </main>
</div>
</body>
</html>
