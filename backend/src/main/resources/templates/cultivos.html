<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|Mis cultivos · ${nombreApp}|">Mis cultivos · Blue Rebhirt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/pantallas.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="pagina">
  <nav class="menu" aria-label="Principal">
    <a class="menu__marca" href="/inicio"><img class="menu__logo" src="/img/logo-emblema.png" alt=""><span th:text="${nombreApp}">Blue Rebhirt</span></a>
    <ul class="menu__lista">
      <li><a class="menu__enlace" href="/inicio">Inicio</a></li>
      <li><a class="menu__enlace" href="/cultivos" aria-current="page">Mis cultivos</a></li>
      <li><a class="menu__enlace" href="/historial">Historial</a></li>
      <li><a class="menu__enlace" href="/guia">Guía de abonos</a></li>
    </ul>
    <div class="menu__acciones">
      <form method="post" th:action="@{/salir}"><button class="btn btn--discreto" type="submit">Salir</button></form>
    </div>
  </nav>

  <main class="contenedor">
    <div class="panel">
      <section class="modulo modulo--formulario panel__protagonista" aria-labelledby="c-titulo">
        <div class="modulo__cabecera">
          <p class="modulo__etiqueta">Tu platanera</p>
          <h1 class="titulo-lg" id="c-titulo">Agregar un <em class="enfasis">cultivo</em></h1>
        </div>
        <form class="modulo__formulario" method="post" th:action="@{/cultivos}">
          <div class="campo">
            <label class="campo__etiqueta" for="c-nombre">Nombre del cultivo</label>
            <input class="campo__input" id="c-nombre" name="nombre" type="text" required maxlength="80" th:value="${datos != null ? datos.nombre : ''}">
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="c-lugar">Dónde queda</label>
            <input class="campo__input" id="c-lugar" name="lugar" type="text" maxlength="120" th:value="${datos != null ? datos.lugar : ''}">
            <p class="campo__ayuda">Una referencia para reconocer el lote.</p>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="c-fecha">Fecha de siembra</label>
            <input class="campo__input" id="c-fecha" name="fecha" type="date" th:value="${datos != null ? datos.fecha : ''}">
          </div>
          <p class="campo__error" th:if="${error}" th:text="${error}"></p><div><button class="btn btn--primario" type="submit">Guardar cultivo</button></div>
        </form>
      </section>

      <section class="modulo modulo--apoyo" th:each="cultivo : ${cultivos}"><p class="modulo__etiqueta">Plátano</p><h2 class="titulo-md" th:text="${cultivo.nombre}">Cultivo</h2><p class="apoyo" th:if="${cultivo.lugar != null}" th:text="${cultivo.lugar}"></p><p class="apoyo" th:if="${cultivo.ultimo_ph == null}">Sin mediciones</p><p class="estado" th:if="${cultivo.ultimo_ph != null}" th:classappend="|estado--${cultivo.ultimo_estado}|"><i aria-hidden="true" th:text="${cultivo.ultimo_estado == 'ok' ? '✓' : (cultivo.ultimo_estado == 'aviso' ? '!' : '▲')}"></i><span th:text="|pH ${cultivo.ultimo_ph} · ${cultivo.ultimo_estado == 'ok' ? 'En rango' : (cultivo.ultimo_estado == 'aviso' ? 'Revisar' : 'Fuera de rango')}|"></span></p></section>

      <nav class="panel__enlaces" aria-label="Más opciones">
        <a class="modulo modulo--enlace" href="/historial">Ver historial</a>
      </nav>
    </div>
  </main>
</div>
</body>
</html>
