<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${titulo} · ${nombreApp}|">Administración</title>
  <link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/componentes.css"><link rel="stylesheet" href="/css/pantallas.css">
</head>
<body><div class="pagina">
  <nav class="menu" aria-label="Administración">
    <a class="menu__marca" href="/admin"><img class="menu__logo" src="/img/logo-emblema.png" alt=""><span th:text="${nombreApp}">Blue Rebhirt</span></a>
    <ul class="menu__lista">
      <li><a class="menu__enlace" href="/admin">Panel</a></li>
      <li><a class="menu__enlace" href="/admin/usuarios">Usuarios</a></li>
      <li><a class="menu__enlace" href="/admin/cultivos" th:attr="aria-current=${titulo == 'Cultivos' ? 'page' : null}">Cultivos</a></li>
      <li><a class="menu__enlace" href="/admin">Rangos</a></li>
    </ul>
    <form method="post" th:action="@{/salir}"><button class="btn btn--discreto" type="submit">Salir</button></form>
  </nav>
  <main class="contenedor"><section class="modulo modulo--apoyo">
    <h1 class="titulo-lg" th:text="${titulo}">Listado</h1>
    <ul class="lista"><li th:each="fila : ${filas}">
      <div><strong th:text="${fila.principal}"></strong><p class="apoyo" th:text="${fila.detalle}"></p></div>
      <span class="apoyo" th:if="${fila.estado == null}">Sin mediciones</span>
      <span class="estado" th:if="${fila.estado != null}" th:classappend="|estado--${fila.estado}|"><i aria-hidden="true" th:text="${fila.estado == 'ok' ? '✓' : (fila.estado == 'aviso' ? '!' : '▲')}"></i><span th:text="${fila.estado == 'ok' ? 'En rango' : (fila.estado == 'aviso' ? 'Revisar' : 'Fuera de rango')}"></span></span>
    </li></ul>
    <p class="apoyo" th:if="${#lists.isEmpty(filas)}">Todavía no hay registros.</p>
  </section></main>
</div></body></html>
