<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|Nueva medición · ${nombreApp}|">Nueva medición · Blue Rebhirt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/pantallas.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="pagina">
  <nav th:replace="~{fragments/menu :: menu('medicion', false)}"></nav>

  <main class="contenedor">
    <div class="panel">
      <section class="modulo modulo--formulario panel__protagonista" aria-labelledby="m-titulo">
        <div class="modulo__cabecera">
          <p class="modulo__etiqueta">Datos de hoy</p>
          <h1 class="titulo-lg" id="m-titulo">Nueva <em class="enfasis">medición</em></h1>
        </div>
        <form class="modulo__formulario" method="post" th:action="@{/mediciones}">
          <div class="campo" th:classappend="${errores['cultivo'] != null} ? 'campo--error'">
            <label class="campo__etiqueta" for="m-cultivo">Cultivo</label>
            <select class="campo__input" id="m-cultivo" name="cultivo" required>
              <option value="">Selecciona tu cultivo</option>
              <option th:each="cultivo : ${cultivos}" th:value="${cultivo.id}" th:text="${cultivo.nombre}" th:selected="${datos['cultivo'] != null and datos['cultivo'] == #strings.toString(cultivo.id)}"></option>
            </select>
            <p class="campo__error" th:if="${errores['cultivo']}" th:text="${errores['cultivo']}"></p>
          </div>

          <div class="grid-2">
            <div class="campo" th:classappend="${errores['ph'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-ph">pH del agua</label>
              <div class="campo__control campo__control--unidad">
                <input class="campo__input" id="m-ph" name="ph" type="number" min="0" max="14" step="0.1" required th:value="${datos['ph']}">
                <span class="campo__unidad">pH</span>
              </div>
              <p class="campo__ayuda">Un número entre 0 y 14.</p>
              <p class="campo__error" th:if="${errores['ph']}" th:text="${errores['ph']}"></p>
            </div>
            <div class="campo" th:classappend="${errores['nivel'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-nivel">Nivel de agua</label>
              <div class="campo__control campo__control--unidad">
                <input class="campo__input" id="m-nivel" name="nivel" type="number" min="0" max="500" step="0.1" required th:value="${datos['nivel']}">
                <span class="campo__unidad">cm</span>
              </div>
              <p class="campo__error" th:if="${errores['nivel']}" th:text="${errores['nivel']}"></p>
            </div>
            <div class="campo" th:classappend="${errores['humedad'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-humedad">Humedad del suelo</label>
              <div class="campo__control campo__control--unidad">
                <input class="campo__input" id="m-humedad" name="humedad" type="number" min="0" max="100" step="0.1" required th:value="${datos['humedad']}">
                <span class="campo__unidad">%</span>
              </div>
              <p class="campo__error" th:if="${errores['humedad']}" th:text="${errores['humedad']}"></p>
            </div>
            <div class="campo" th:classappend="${errores['temperatura'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-temp">Temperatura</label>
              <div class="campo__control campo__control--unidad">
                <input class="campo__input" id="m-temp" name="temperatura" type="number" min="-5" max="60" step="0.1" required th:value="${datos['temperatura']}">
                <span class="campo__unidad">°C</span>
              </div>
              <p class="campo__error" th:if="${errores['temperatura']}" th:text="${errores['temperatura']}"></p>
            </div>
          </div>

          <h2 class="titulo-md">Cuéntanos de <em class="enfasis">tu cultivo</em></h2>
          <div class="grupo">
            <div class="campo" th:classappend="${errores['hojas'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-hojas">¿Cómo se ven las hojas?</label>
              <select class="campo__input" id="m-hojas" name="hojas">
                <option value="verdes" th:selected="${datos['hojas'] == 'verdes'}">Verdes y firmes</option>
                <option value="amarillas" th:selected="${datos['hojas'] == 'amarillas'}">Amarillas</option>
                <option value="manchas" th:selected="${datos['hojas'] == 'manchas'}">Con manchas</option>
              </select>
              <p class="campo__error" th:if="${errores['hojas']}" th:text="${errores['hojas']}"></p>
            </div>
            <div class="campo" th:classappend="${errores['abono'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-abono">¿Cuándo abonaste por última vez?</label>
              <select class="campo__input" id="m-abono" name="abono">
                <option value="menos_2_semanas" th:selected="${datos['abono'] == 'menos_2_semanas'}">Hace menos de 2 semanas</option>
                <option value="2_a_4_semanas" th:selected="${datos['abono'] == '2_a_4_semanas'}">Hace 2 a 4 semanas</option>
                <option value="mas_1_mes" th:selected="${datos['abono'] == 'mas_1_mes'}">Hace más de un mes</option>
                <option value="nunca" th:selected="${datos['abono'] == 'nunca'}">Todavía no he abonado</option>
              </select>
              <p class="campo__error" th:if="${errores['abono']}" th:text="${errores['abono']}"></p>
            </div>
            <div class="campo" th:classappend="${errores['lluvia'] != null} ? 'campo--error'">
              <label class="campo__etiqueta" for="m-lluvia">¿Llovió en los últimos 3 días?</label>
              <select class="campo__input" id="m-lluvia" name="lluvia">
                <option value="0" th:selected="${datos['lluvia'] == '0'}">No</option>
                <option value="1" th:selected="${datos['lluvia'] == '1'}">Sí</option>
              </select>
              <p class="campo__error" th:if="${errores['lluvia']}" th:text="${errores['lluvia']}"></p>
            </div>
          </div>

          <p class="campo__error" th:if="${error}" th:text="${error}"></p><div><button class="btn btn--primario" type="submit">Calcular</button></div>
        </form>
      </section>

      <section class="modulo modulo--apoyo" aria-labelledby="m-ayuda">
        <p class="modulo__etiqueta">Antes de medir</p>
        <h2 class="titulo-md" id="m-ayuda">Cómo <em class="enfasis">medir bien</em></h2>
        <ol class="pasos">
          <li class="cuerpo">Mide con el agua en reposo.</li>
          <li class="cuerpo">Enjuaga el sensor con agua limpia antes y después.</li>
          <li class="cuerpo">Calibra el sensor con sus soluciones de calibración cada cierto tiempo.</li>
        </ol>
      </section>
    </div>
  </main>
</div>
</body>
</html>
