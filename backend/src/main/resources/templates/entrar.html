<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|Entrar · ${nombreApp}|">Entrar · Blue Rebhirt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/pantallas.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="pagina">
  <nav th:replace="~{fragments/menu :: menu('acceso', false)}"></nav>

  <main class="centrado">
    <form class="acceso" aria-labelledby="e-titulo" method="post" th:action="@{/entrar}">
      <input type="hidden" name="rol" th:value="${rolElegido}">
      <h1 class="titulo-lg" id="e-titulo"><em class="enfasis">Entrar</em></h1>
      <p class="apoyo" th:text="${rolElegido == 'administrador' ? 'Administrador' : 'Agricultor'}"></p>
      <div class="acceso__form">
        <div class="campo">
          <label class="campo__etiqueta" for="e-correo">Correo</label>
          <input class="campo__input" id="e-correo" name="username" type="email" required autocomplete="email">
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="e-clave">Contraseña</label>
          <input class="campo__input" id="e-clave" name="password" type="password" required autocomplete="current-password">
        </div>
      </div>
      <p class="campo__error" th:if="${param.error}">Correo o contraseña incorrectos.</p><button class="btn btn--primario btn--completo" type="submit">Entrar</button>
      <div class="acceso__alterno"><a class="btn btn--discreto" href="/entrar">Cambiar de rol</a> <a class="btn btn--discreto" href="/registro" th:if="${rolElegido == 'agricultor'}">Crear cuenta</a></div>
    </form>
  </main>
</div>
</body>
</html>
